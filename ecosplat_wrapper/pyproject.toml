[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosplat-wrapper"
version = "0.1.0"
description = "EcoSplat IGF training-strategy wrapper for feed-forward 3DGS hosts"
authors = [{ name = "Minh-Quan Viet Bui" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "einops",
    "jaxtyping",
]

[tool.setuptools.packages.find]
include = ["ecosplat_wrapper*"]
