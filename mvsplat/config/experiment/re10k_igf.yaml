# @package _global_
#
# EcoSplat IGF stage-2 finetune of ZPressor-mvsplat on RE10K.
# Mirrors ZPressor's training recipe from README; the ONLY addition is the
# IGF loss path (merge head + L_io BCE) for learning merged Gaussians.
#
# Reference command from ZPressor README:
#   python -m src.main +experiment=re10k \
#       data_loader.train.batch_size=1 \
#       dataset.view_sampler.num_context_views=12 \
#       dataset.view_sampler.num_target_views=8 \
#       model.encoder.cluster_num=6 model.encoder.use_cluster=true
#
# Launch: `./train.sh` or `python -m src.main +experiment=re10k_igf`

defaults:
  - override /dataset: re10k
  - override /model/encoder: costvolume
  - override /loss: [mse, lpips]

wandb:
  name: re10k_igf
  tags: [re10k, 256x256, igf]

# `batch_size` not set here — handle on CLI (IGF adds extra renders so
# baseline ZPressor batch=1 may need to shrink further).
# data_loader: { train: { batch_size: 1 } }

trainer:
  max_steps: 300_001

# ZPressor recipe: 12 context / 8 target views.
dataset:
  image_shape: [256, 256]
  roots: [datasets/re10k]
  near: 1.
  far: 100.
  baseline_scale_bounds: false
  make_baseline_1: false
  view_sampler:
    num_context_views: 12
    num_target_views: 8

# Train ALL params. Base lr small for pretrained ZPressor backbone /
# depth_predictor; IGF merge head + rate_embed + igf_rate_proj get
# `lr * igf_lr_multiplier` (= ZPressor's stage-1 lr 2e-4 by default).
optimizer:
  lr: 2.e-5
  igf_lr_multiplier: 10.0
  cosine_lr: true
  warm_up_steps: 2000

model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]
    # ZPressor settings - must match the stage-1 ckpt arch.
    use_cluster: true
    cluster_num: 6
    num_layers: 6
    # IGF stage-2 activation. Empty dict -> IGFConfig defaults
    # (loss_weight=0.1, io_weight=0.1, acc_weight=1.0, PLGC 0.85-0.95).
    igf: {}
    stage1_weights_path: pretrained/mvsplat-re10k-zpressor-n200-256x256.ckpt

loss:
  lpips:
    apply_after_step: 0
    weight: 0.05

test:
  eval_time_skip_steps: 5
  compute_scores: true

# Bake wandb.name into the output dir so runs are self-describing.
# Example: outputs/re10k_igf/2026-05-15_13-12-16/
hydra:
  run:
    dir: outputs/${wandb.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
